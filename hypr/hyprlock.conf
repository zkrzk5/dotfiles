$bg = rgba(28, 28, 28, 0.85)
$fg = rgb(212, 190, 152)
$fg-alt = rgb(146, 131, 116)
$accent = rgb(216, 166, 87)
$border = rgb(69, 64, 61)
$error = rgb(234, 105, 98)

general {
    disable_loading_bar = true
    grace = 2
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = ~/walls/wallhaven-7jeozo.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
}

# --- Clock ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M')"
    color = $fg
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $fg-alt
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# --- Password field ---
input-field {
    monitor =
    size = 260, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = $border
    inner_color = $bg
    font_color = $fg
    check_color = $accent
    fail_color = $error

    placeholder_text = <span foreground="##928374">Password...</span>
    fail_text = <span foreground="##ea6962">Wrong password</span>

    position = 0, -140
    halign = center
    valign = center
    rounding = 16
    fade_on_empty = false
}